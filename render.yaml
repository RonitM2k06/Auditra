# Render Blueprint: temporary judge demo of AUDITRA.
# The app has NO login. Use only the fictional demo data and delete the service after judging.
services:
  - type: web
    name: auditra
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /api/health
    autoDeploy: false
    # No persistent disk: the SQLite file lives in the container and is recreated (with the
    # Northstar demo seeded) whenever the instance restarts or redeploys. For a judge demo this
    # means stray edits do not persist. To keep data, switch to a paid plan, add a disk, e.g.
    #   disk: { name: data, mountPath: /var/data, sizeGB: 1 }
    # and set DATABASE_URL=sqlite:////var/data/auditra.db
    # AI keys are intentionally not set; reviews run on the rule engine.
